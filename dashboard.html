<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OpenCrawl Dashboard</title><style>:root{--g:#20f39c;--b:#080909;--p:#111413;--l:#29302d;--m:#929a96}*{box-sizing:border-box}body{margin:0;background:var(--b);color:#fff;font:15px Arial}header{border-bottom:1px solid var(--l);padding:24px 5vw;display:flex;justify-content:space-between}.brand{font-weight:bold;font-size:20px}.brand b,.ok{color:var(--g)}a{color:var(--g)}main{max-width:1200px;margin:auto;padding:65px 5vw}h1{font-size:56px;font-weight:400;letter-spacing:-4px;margin:15px 0}.sub,.small{color:var(--m);font:13px monospace}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:42px 0 16px}.card{background:var(--p);border:1px solid var(--l);padding:20px}.card strong{display:block;color:var(--g);font:40px monospace;margin-bottom:12px}.status{padding:18px;border:1px solid var(--l);color:var(--g);font:13px monospace}.history{display:grid;gap:10px;margin-top:20px}.run{border:1px solid var(--l);padding:18px;background:var(--p);display:flex;justify-content:space-between}.run small{display:block;color:var(--m);font:12px monospace;margin-top:7px}.run a{font:12px monospace}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:43px}.run{display:block}}
</style></head><body><header><div class="brand"><b>◆</b> OPENCRAWL</div><a href="/">← Home</a></header><main><div class="small">WORKSPACE / CRAWL HISTORY</div><h1>Everything you captured.</h1><p class="sub">Every run, result, and saved artifact in one place.</p><div class="grid"><div class="card"><strong id="pages">—</strong><span class="small">Pages captured</span></div><div class="card"><strong id="assets">—</strong><span class="small">Assets saved</span></div><div class="card"><strong id="skipped">—</strong><span class="small">Robots skipped</span></div><div class="card"><strong id="failed">—</strong><span class="small">Failures</span></div></div><div class="status" id="status">● Checking local crawler…</div><h2>Recent runs</h2><div class="history" id="history"></div></main><script>const $=x=>document.getElementById(x);async function refresh(){const d=await fetch('/api/status').then(r=>r.json());$('status').textContent=d.active?'● CRAWLING — '+d.phase:'● '+(d.complete?(d.code===0?'COMPLETE':'FAILED'):'READY')+(d.url?' — '+d.url:'');if(d.complete){try{const r=await fetch('/output/'+d.id+'/crawl-report.json').then(x=>x.json()),s=r.summary||{};for(const [k,v] of Object.entries({pages:s.pagesSaved,assets:s.assetsSaved,skipped:s.skippedByRobots,failed:s.pagesFailed}))$(k).textContent=v??0}catch{}}$('history').innerHTML=(d.history||[]).reverse().map(r=>`<div class="run"><div><span class="ok">● ${r.code===0?'COMPLETE':'FAILED'}</span><small>${r.url}<br>${r.finishedAt||r.startedAt}</small></div><a href="/output/${r.id}/" target="_blank">Open capture →</a></div>`).join('')||'<div class="small">No completed crawls yet.</div>'}refresh();setInterval(refresh,2000)</script></body></html>
