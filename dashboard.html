<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OpenCrawl Dashboard</title><style>
:root{--g:#20f39c;--b:#080909;--p:#111413;--l:#29302d;--m:#929a96}*{box-sizing:border-box}body{margin:0;background:var(--b);color:#fff;font:15px Arial}header{height:76px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;padding:0 5vw}.brand{font-weight:bold;font-size:20px}.brand b,a,.ok{color:var(--g)}a{text-decoration:none}main{max-width:1200px;margin:auto;padding:65px 5vw}h1{font-size:clamp(44px,7vw,78px);font-weight:400;letter-spacing:-5px;margin:15px 0}.small{color:var(--m);font:12px monospace}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:42px 0 16px}.card,.run{background:var(--p);border:1px solid var(--l);padding:20px}.card strong{display:block;color:var(--g);font:40px monospace;margin-bottom:12px}.status{border:1px solid var(--l);padding:18px;color:var(--g);font:13px monospace;margin:22px 0 55px;min-height:52px}.history{display:grid;gap:10px;margin-top:18px}.run{display:flex;justify-content:space-between;gap:20px;align-items:center}.run small{display:block;color:var(--m);font:12px monospace;margin-top:8px}.actions{display:flex;gap:16px;flex-wrap:wrap}.action{border:1px solid var(--g);padding:10px 13px;font:12px monospace}.action.primary{background:var(--g);color:#06100b}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.run{display:block}.actions{margin-top:18px}}
</style></head><body><header><div class="brand"><b>◆</b> OPENCRAWL</div><a href="/">← Home</a></header><main><div class="small">WORKSPACE / CRAWL HISTORY</div><h1>Everything you captured.</h1><p class="small">Runs are saved locally until you remove them.</p><div class="grid"><div class="card"><strong id="pages">—</strong><span class="small">Pages captured</span></div><div class="card"><strong id="assets">—</strong><span class="small">Assets saved</span></div><div class="card"><strong id="skipped">—</strong><span class="small">Robots skipped</span></div><div class="card"><strong id="failed">—</strong><span class="small">Failures</span></div></div><div class="status" id="status">● Checking crawler…</div><h2>Recent runs</h2><div class="history" id="history"></div></main><script>const $=id=>document.getElementById(id);async function refresh(){try{const d=await fetch('/api/status').then(r=>r.json());$('status').textContent=d.active?'● CRAWLING — '+d.phase+' — '+d.url:'● '+(d.complete?(d.code===0?'COMPLETE':'FAILED'):'READY')+(d.url?' — '+d.url:'');if(d.complete){const r=await fetch('/output/'+d.id+'/crawl-report.json').then(x=>x.json()),s=r.summary||{};for(const[k,v]of Object.entries({pages:s.pagesSaved,assets:s.assetsSaved,skipped:s.skippedByRobots,failed:s.pagesFailed}))$(k).textContent=v??0}$('history').innerHTML=(d.history||[]).reverse().map(r=>`<article class="run"><div><span class="ok">● ${r.code===0?'COMPLETE':'FAILED'}</span><small>${r.url}<br>${r.finishedAt||r.startedAt}</small></div><div class="actions"><a class="action primary" href="/output/${r.id}/" target="_blank">Open capture</a><a class="action" href="/api/download/${r.id}" download>Download report</a></div></article>`).join('')||'<p class="small">No crawls yet. Return home and start one.</p>'}catch(e){$('status').textContent='● DASHBOARD ERROR — '+e.message}}refresh();setInterval(refresh,2000)</script></body></html>
